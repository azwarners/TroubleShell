[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "troubleshell"
version = "0.1.0"
description = "A Linux terminal with an AI troubleshooting pane."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Nick"}]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
desktop = ["PyGObject>=3.46"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
dev = ["ruff>=0.6"]

[project.scripts]
troubleshell = "troubleshell.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
